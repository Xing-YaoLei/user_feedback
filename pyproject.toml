[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nested2arrow"
version = "0.1.0"
description = "Semantics-preserving nested JSON to Arrow/Parquet converter"
requires-python = ">=3.11"
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nested2arrow = "nested2arrow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
