# 本地开发用 mosquitto 配置：只监听本机回环，无需账号密码
# 持久化必须开启——采集器 clean_session=false 离线期间，broker 靠它排队 QoS1 消息
per_listener_settings true

listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

persistence true
persistence_file mosquitto.db
persistence_location /tmp/mosquitto-telemetry/

# 离线客户端最多缓存 1000 条消息（默认无限，本地开发给个上限）
max_queued_messages 1000

log_dest file /tmp/mosquitto-telemetry/broker.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
