    <section id="top">

      <p>第一次展开安装步骤：<a data-include href="../../shared/basics.html#install">安装</a>。</p>

      <p>第二次展开深入说明：<a data-include href="../../shared/advanced.html#deep">深入说明</a>。</p>
      <p>收尾段落。</p>
    </section>

    <h2 id="repeat">再来一次</h2>
    <p>这里再次引用安装片段：<a data-include href="../../shared/basics.html#install">安装</a>。</p>
